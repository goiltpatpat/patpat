name: Validate

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Validate repository contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/run_ci_suite.py --suite contracts

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".codex-plugin/plugin.json", encoding="utf-8"))["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"


  publish-attestation:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Promote fixture attestation outside the worktree
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          tracked="$(git ls-files -- attestation.json receipt.json '*.jsonl')"
          test -z "${tracked}"
          echo "HEAD $(git rev-parse HEAD)"
          python3 scripts/publish_codex_attestation.py \
            --ci-fixture \
            --source "${GITHUB_WORKSPACE}" \
            --destination "${RUNNER_TEMP}/public"
          test -f "${RUNNER_TEMP}/public/attestation.json"
          test ! -f "${GITHUB_WORKSPACE}/attestation.json"
          test ! -f "${GITHUB_WORKSPACE}/receipt.json"
          tracked="$(git ls-files -- attestation.json receipt.json '*.jsonl')"
          test -z "${tracked}"
          python3 -c "from pathlib import Path; p=Path('${RUNNER_TEMP}/public/attestation.json'); names={p.name}; assert names=={'attestation.json'}"

      - name: Upload sanitized attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patpat-codex-fixture-attestation
          path: ${{ runner.temp }}/public/attestation.json
          if-no-files-found: error

  # Python floor is 3.11+ (datetime.UTC). One Windows job covers path-sensitive
  # installer, updater, staging, and durable-state tests. No version matrix.
  # Delivery-gate self-tests spawn many git processes, and the run-state suite alone
  # takes about 7.5 minutes on this runner.
  windows-paths:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Path-sensitive installer, updater, staging, and durable-state
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/run_ci_suite.py --suite windows-paths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The Windows checkout converts goldens to CRLF and Java prints CRLF; replayed TLC output covers both.
      - name: Statechart TLC output on a CRLF checkout
        working-directory: skills/patpat-statechart/scripts
        run: |
          node --test test/output-lines.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-name-pattern="writes the committed chart and report from TLC's output" test/cli.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
